<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NervDash</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/gridstack@10.2.3/dist/gridstack.min.css"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="crt-screen">
    <div class="scanline-overlay"></div>
    <div class="dashboard">
      <header class="dashboard__header">
        <div class="dashboard__logo">NERV</div>
        <div class="dashboard__title">Local Operations Dashboard</div>
        <div class="dashboard__status" id="system-status">INITIALIZING</div>
      </header>
      <main class="grid-stack" id="grid"></main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.2.3/dist/gridstack-h5.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
